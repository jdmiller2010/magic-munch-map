<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7789">
<title>Magic Munch Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22a%22%20x1%3D%227%22%20y1%3D%224%22%20x2%3D%2231%22%20y2%3D%2234%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2337c3d8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230e8fa8%22%2F%3E%3C%2FlinearGradient%3E%3Cmask%20id%3D%22b%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2230.2%22%20cy%3D%229.5%22%20r%3D%226.2%22%2F%3E%3Ccircle%20cx%3D%2226.5%22%20cy%3D%222.8%22%20r%3D%223.2%22%2F%3E%3C%2Fmask%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M19%2036C13%2027%208%2020%208%2014a11%2011%200%201%201%2022%200c0%206-5%2013-11%2022z%22%20fill%3D%22url%28%23a%29%22%20mask%3D%22url%28%23b%29%22%2F%3E%3Ccircle%20cx%3D%2219%22%20cy%3D%2214%22%20r%3D%224.7%22%20fill%3D%22%23fbfdfe%22%2F%3E%3Ccircle%20cx%3D%2219%22%20cy%3D%2214%22%20r%3D%222.6%22%20fill%3D%22%230a4f5e%22%2F%3E%3Ccircle%20cx%3D%2217.85%22%20cy%3D%2212.85%22%20r%3D%221%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M5.2%2023Q5.2%2027%209.2%2027Q5.2%2027%205.2%2031Q5.2%2027%201.2%2027Q5.2%2027%205.2%2023Z%22%20fill%3D%22%23e09400%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Sun-bleached earth with EVE against it: warm sand ground, glowing
     cyan chrome, Buy-n-Large amber for anything worth stopping for. */
  :root{
    --bg:#f7f2e8;
    --surface:#fffdf8;
    --surface-2:#efe7d8;
    --ink:#2c2317;
    --muted:#756a58;
    --line:#e5dac6;
    --brand:#0b7789;
    --brand-soft:#e3f3f7;
    --on-brand:#ffffff;
    --gold:#e09400;
    --gold-soft:#fff2d4;
    --logo-a:#37c3d8;
    --logo-b:#0e8fa8;
    --food:#c64f29;
    --shadow:0 1px 2px rgba(74,54,24,.07),0 6px 20px rgba(74,54,24,.09);
    --shadow-lg:0 10px 34px rgba(74,54,24,.18);
    --r-lg:26px; --r-md:18px; --r-sm:13px;
    --spring:cubic-bezier(.34,1.56,.64,1);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  /* Night side of the Axiom. */
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#131820; --surface:#1c232e; --surface-2:#26303d; --ink:#eef2f7;
      --muted:#9ba7b7; --line:#2f3a49; --brand:#3fcde2; --brand-soft:#0d3742; --on-brand:#06272f;
      --gold:#ffc247; --gold-soft:#3d3111;
      --logo-a:#6fe3f2; --logo-b:#2ab4cd;
      --food:#ff8460;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
      --shadow-lg:0 8px 34px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(84px + var(--safe-b));
  }
  h1,h2,.ttl{font-family:"Fredoka",sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
  a{color:var(--brand)}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}

  /* app bar */
  .appbar{
    position:sticky;top:0;z-index:600;background:var(--bg);
    border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))
  }
  .barrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
  .barend{display:flex;align-items:center;gap:8px;flex:none}
  .acct{
    appearance:none;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;
    padding:6px 12px;border-radius:999px;border:1px solid var(--brand);
    background:var(--brand);color:var(--on-brand);transition:transform .2s var(--spring)
  }
  .acct:active{transform:scale(.95)}
  .acct.in{background:var(--brand-soft);color:var(--brand);border-color:transparent}
  .appbar h1{font-size:20px}
  .appbar h1 .mm{color:var(--food)}
  .appbar .sub{font-size:12.5px;color:var(--muted);margin-top:1px;font-weight:500}
  .count{
    font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);
    padding:5px 10px;border-radius:999px;white-space:nowrap
  }

  /* brand */
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brandtext{min-width:0}
  .mark{flex:none;width:40px;height:40px;display:block}
  .mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(14,143,168,.34))}
  .mark .eye{transform-box:fill-box;transform-origin:center;animation:blink 6.5s infinite}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.12)}}
  .mark .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
  .mark .tw2{animation-delay:1.4s}
  @keyframes tw{0%,100%{opacity:.4;transform:scale(.78)}50%{opacity:1;transform:scale(1)}}

  /* segmented control */
  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin-bottom:10px}
  .seg button{
    flex:1;appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-size:13px;font-weight:600;padding:8px 4px;border-radius:9px;transition:background .18s,color .18s
  }
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  /* map */
  .mapwrap{padding:12px 16px 0}
  .placebar{
    display:flex;align-items:center;gap:10px;margin-bottom:9px;padding:10px 12px;
    border-radius:var(--r-md);background:var(--brand-soft);color:var(--brand);
    font-size:13.5px;font-weight:600
  }
  .placebar span{flex:1;min-width:0}
  .placebar .btn{margin:0;padding:6px 12px;font-size:12.5px}
  #map{
    height:52vh;min-height:300px;border-radius:var(--r-lg);
    border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface-2)
  }
  .leaflet-container{font-family:"Inter",sans-serif;border-radius:var(--r-lg)}
  .leaflet-popup-content-wrapper{border-radius:var(--r-md);box-shadow:var(--shadow-lg)}

  /* filters */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;appearance:none;cursor:pointer;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;gap:7px;
    transition:transform .2s var(--spring)
  }
  .chip:active{transform:scale(.96)}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip[aria-pressed="true"]{color:var(--surface);border-color:transparent}
  .chip[aria-pressed="true"] .dot{background:currentColor;opacity:.85}
  .chip[data-must][aria-pressed="true"]{background:var(--gold);color:#2a2000;border-color:transparent}
  .chip[data-park][aria-pressed="true"],
  .chip[data-meal][aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:transparent}
  .chip.sep{margin-left:6px;position:relative}
  .chip.sep::before{content:"";position:absolute;left:-9px;top:6px;bottom:6px;width:1px;background:var(--line)}

  /* view switching */
  body[data-view="list"] .mapwrap,
  body[data-view="time"] .mapwrap,
  body[data-view="tried"] .mapwrap{display:none}
  body[data-view="map"] .list,
  body[data-view="map"] .tools{display:none}
  body[data-view="map"] #map{height:64vh}
  body[data-view="time"] .chips{padding-bottom:2px}

  /* timeline */
  .dayhead{
    display:flex;align-items:baseline;gap:9px;margin:0 2px 4px;
    padding-bottom:7px;border-bottom:2px solid var(--line)
  }
  .dayhead .nm{font-family:"Fredoka",sans-serif;font-weight:600;font-size:16.5px}
  .dayhead .ct{font-size:11px;font-weight:600;color:var(--muted)}
  .mealhead{
    font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin:15px 2px 8px
  }

  .searchbox{padding:10px 16px 0;position:relative}
  .searchbox svg{position:absolute;left:29px;top:50%;transform:translateY(-45%);color:var(--muted);pointer-events:none}
  #search{
    width:100%;font-family:inherit;font-size:15px;padding:11px 14px 11px 40px;
    border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
    color:var(--ink);box-shadow:var(--shadow)
  }
  #search::placeholder{color:var(--muted)}

  /* list */
  .list{padding:6px 16px 0}
  .group{margin-top:20px}
  .grouphead{display:flex;align-items:baseline;gap:8px;margin:0 2px 9px}
  .grouphead .nm{font-family:"Fredoka",sans-serif;font-weight:600;font-size:15px}
  .grouphead .pk{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    box-shadow:var(--shadow);padding:13px 13px 12px;margin-bottom:10px;
    display:flex;gap:12px;align-items:flex-start;
    transition:transform .2s var(--spring),box-shadow .2s ease
  }
  @media (hover:hover){
    .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  }
  .card.must{border-color:var(--gold);background:linear-gradient(0deg,var(--gold-soft),var(--gold-soft))}
  .swatch{
    width:34px;height:34px;border-radius:13px;flex:none;display:flex;align-items:center;
    justify-content:center;color:#fff;transition:transform .25s var(--spring)
  }
  @media (hover:hover){ .card:hover .swatch{transform:rotate(-6deg) scale(1.06)} }
  .swatch svg{width:18px;height:18px}
  .card .body{flex:1;min-width:0}
  .card .name{
    font-family:"Fredoka",sans-serif;font-weight:600;font-size:15.5px;line-height:1.3;
    background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)
  }
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .tag{
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;
    background:var(--surface-2);color:var(--muted)
  }
  .tag.gold{background:var(--gold);color:#2a2000}
  .tag.meal{background:var(--brand-soft);color:var(--brand)}
  .tag.nowhere{background:transparent;border:1px dashed var(--line);color:var(--muted)}
  .tag.tried{background:#358352;color:#fff}
  .note{margin:7px 0 0;font-size:13.5px;color:var(--muted);word-wrap:break-word}
  .acts{display:grid;grid-template-columns:repeat(2,34px);gap:6px;flex:none}
  .iconbtn{
    appearance:none;width:34px;height:34px;padding:0;cursor:pointer;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
    display:flex;align-items:center;justify-content:center;transition:transform .2s var(--spring)
  }
  .iconbtn:active{transform:scale(.92)}
  .iconbtn svg{width:17px;height:17px}
  .iconbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2a2000}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:34px 20px}
  .card.ghost{border-style:dashed;background:transparent;box-shadow:none}
  .card.ghost .name{cursor:default}
  .acts.one{grid-template-columns:34px}

  /* tools */
  .tools{padding:26px 16px 0}
  .tools h2{font-size:16px;margin-bottom:10px}
  .btn{
    appearance:none;cursor:pointer;font-size:13.5px;font-weight:600;padding:10px 15px;
    margin:0 8px 8px 0;border-radius:var(--r-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);box-shadow:var(--shadow);transition:transform .2s var(--spring)
  }
  .btn:active{transform:scale(.97)}
  .btn.solid{background:var(--brand);border-color:transparent;color:var(--on-brand)}
  .btn[aria-pressed="true"]{background:var(--gold);border-color:transparent;color:#2a2000}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:58ch}

  /* account menu */
  .menuwrap{position:relative;flex:none}
  .menu{
    position:absolute;right:0;top:calc(100% + 8px);z-index:800;width:252px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    box-shadow:var(--shadow-lg);padding:8px
  }
  .menutop{display:flex;align-items:center;gap:8px;padding:4px 8px 0}
  .menu .who{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu .msg{font-size:12px;color:var(--muted);margin:6px 8px 4px;line-height:1.45}
  .menu .msg:empty{display:none}
  .mi{
    display:block;width:100%;text-align:left;appearance:none;border:0;cursor:pointer;
    background:transparent;color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;
    padding:10px 8px;border-radius:var(--r-sm)
  }
  .mi:hover,.mi:focus{background:var(--surface-2)}
  .mi[aria-pressed="true"]{background:var(--gold);color:#2a2000}
  .mi.danger{color:var(--food)}
  .mi.danger.armed{background:var(--food);color:#fff}
  .mdiv{height:1px;background:var(--line);margin:6px 4px}

  /* sync panel */
  [hidden]{display:none!important}
  .sync{
    border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);
    box-shadow:var(--shadow);padding:12px 13px;margin:0 0 14px
  }
  .sync .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .sync .lbl{font-family:"Fredoka",sans-serif;font-weight:600;font-size:13.5px;flex:none}
  .sync .who{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sync .spacer{flex:1}
  .sync .btn{margin:0}
  .sync .msg{font-size:13px;color:var(--muted);margin:9px 0 0;max-width:58ch}
  .sync .msg:empty{display:none}
  .dotstat{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
  .dotstat.ok{background:#358352}
  .dotstat.warn{background:var(--gold)}

  /* fab */
  .fab{
    position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:700;
    appearance:none;cursor:pointer;border:0;border-radius:999px;background:var(--brand);color:var(--on-brand);
    font-size:14.5px;font-weight:600;padding:14px 20px;box-shadow:var(--shadow-lg);
    display:flex;align-items:center;gap:8px;transition:transform .2s var(--spring)
  }
  .fab{animation:bob 3.6s ease-in-out infinite}
  .fab:active{animation:none;transform:scale(.94)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
  .fab svg{width:18px;height:18px}
  .fab[aria-pressed="true"]{background:var(--gold);color:#2a2000}

  /* sheet */
  dialog{
    border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:520px;
    border-radius:var(--r-lg) var(--r-lg) 0 0;margin:auto auto 0;box-shadow:var(--shadow-lg)
  }
  dialog::backdrop{background:rgba(15,15,35,.5)}
  dialog[open]{animation:rise .24s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px}
  .sheet{padding:8px 18px calc(20px + var(--safe-b))}
  .sheet h2{font-size:18px;margin-bottom:14px}
  .field{margin-bottom:12px;position:relative}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{
    width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);
    border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink)
  }
  .field textarea{resize:vertical;min-height:62px}
  .switch{
    display:flex;align-items:center;gap:9px;cursor:pointer;margin:2px 0 12px;
    font-size:14px;font-weight:600
  }
  .switch input{width:19px;height:19px;accent-color:var(--brand);flex:none;margin:0}
  .stars{display:flex;gap:3px;padding-top:3px}
  .stars button{
    appearance:none;border:0;background:transparent;cursor:pointer;padding:1px;
    color:var(--line);transition:transform .2s var(--spring)
  }
  .stars button svg{width:25px;height:25px;display:block}
  .stars button.on{color:var(--gold)}
  .stars button:active{transform:scale(.86)}
  .rate{display:flex;gap:2px;margin-top:6px;color:var(--gold)}
  .rate svg{width:14px;height:14px;display:block}
  .rate .off{color:var(--line)}
  .verdict{margin:6px 0 0;font-size:13.5px;color:var(--ink);font-style:italic}
  .wlink{
    display:inline-block;margin-top:7px;font-size:12.5px;font-weight:600;
    color:var(--brand);text-decoration:none
  }
  .wlink:hover{text-decoration:underline}
  .seg button{font-size:12.5px}
  .two{display:flex;gap:10px}
  .two .field{flex:1;min-width:0}
  .err{color:var(--food);font-size:13px;font-weight:600;margin:0 0 10px;display:none}
  .acnote{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
  .acnote:empty{display:none}
  .acbox{
    position:absolute;left:0;right:0;top:100%;z-index:20;margin-top:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    box-shadow:var(--shadow-lg);max-height:212px;overflow-y:auto
  }
  .acbox button{
    display:block;width:100%;text-align:left;appearance:none;border:0;cursor:pointer;
    background:transparent;color:var(--ink);font-size:14px;font-weight:500;
    padding:9px 12px;border-bottom:1px solid var(--line)
  }
  .acbox button:last-child{border-bottom:0}
  .acbox button:hover,.acbox button:focus{background:var(--surface-2)}
  .acbox .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
  .row{display:flex;gap:10px;margin-top:16px}
  .row .btn{flex:1;margin:0;text-align:center}
  @media (min-width:640px){
    dialog{border-radius:var(--r-lg);margin:auto}
    .grab{display:none}
  }

  /* pins */
  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    border:2.5px solid #fff;box-shadow:0 3px 8px rgba(44,35,23,.35);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center
  }
  /* every pin is a small character looking back at you */
  .pin i{width:9px;height:9px;border-radius:50%;background:#0a4f5e;border:2px solid #fbfdfe;display:block}
  .pin.must{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,148,0,.3),0 3px 8px rgba(44,35,23,.35)}
  .pop{font-family:"Inter",sans-serif;color:#2c2317}
  .pop b{font-family:"Fredoka",sans-serif;font-size:14.5px;display:block;line-height:1.3}
  .pop .m{font-size:11.5px;color:#756a58;margin-top:2px}
  .pop .n{margin-top:6px;font-size:13px}
  .pop .g{display:inline-block;margin-top:7px;background:#e09400;color:#2a2000;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}

  footer{padding:28px 16px 0;font-size:12px;line-height:1.7;color:var(--muted)}

  @media (min-width:860px){
    .appbar h1{font-size:24px}
    #map{height:58vh}
    .list{columns:2;column-gap:22px}
    .group{break-inside:avoid}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  var KEY = "magicMunchMap.v1";
  var LEGACY_KEY = "parkFoodMap.v1";
  // Leaflet injects markers outside the themed tree, so this mirrors the
  // --food token by hand. Keep them in step.
  var FOOD = "#c64f29";
  var PARKS  = { dl:"Disneyland", dca:"California Adventure", dtd:"Downtown Disney" };
  // Free text let "Main Street" and "Main Street, U.S.A." split into two groups.
  // Park names drift (Critter Country -> Bayou Country, Pacific Wharf ->
  // San Fransokyo Square); edit here when they do.
  var LANDS  = {
    dl: ["Main Street, U.S.A.", "Adventureland", "New Orleans Square", "Bayou Country",
         "Frontierland", "Fantasyland", "Mickey's Toontown", "Tomorrowland",
         "Star Wars: Galaxy's Edge"],
    dca:["Buena Vista Street", "Hollywood Land", "Avengers Campus", "Cars Land",
         "San Fransokyo Square", "Paradise Gardens Park", "Pixar Pier", "Grizzly Peak"],
    dtd:["Downtown Disney District", "Disneyland Hotel", "Grand Californian Hotel",
         "Pixar Place Hotel"]
  };
  // Chronological, which is the order the timeline lays a day out in.
  var MEALS  = [
    { k:"breakfast", label:"Breakfast" },
    { k:"am",        label:"AM Snack"  },
    { k:"lunch",     label:"Lunch"     },
    { k:"pm",        label:"PM Snack"  },
    { k:"dinner",    label:"Dinner"    }
  ];
  var MEAL_LABEL = {}, MEAL_ORDER = {};
  MEALS.forEach(function(m, i){ MEAL_LABEL[m.k] = m.label; MEAL_ORDER[m.k] = i; });
  var CENTER = { all:[33.8093,-117.9190], dl:[33.8125,-117.9190], dca:[33.8060,-117.9180], dtd:[33.8090,-117.9235] };
  var ZOOM   = { all:16, dl:17, dca:17, dtd:17 };
  var GLYPH = '<path d="M4 3v8a3 3 0 003 3v7M7 3v6M10 3v6M17 3c-1.5 0-2.5 3-2.5 6s1 4 2.5 4v8"/>';

  var state = {
    view:"list",
    parks:{ dl:true, dca:true, dtd:true },
    meals:{ breakfast:true, am:true, lunch:true, pm:true, dinner:true, none:true },
    mustOnly:false, query:"", moving:false
  };
  var places = load();
  var markers = {};
  var placingId = null;   // id of the place waiting for a map tap
  var editingId = null;

  function byId(id){
    for(var i=0;i<places.length;i++){ if(places[i].id === id) return places[i]; }
    return null;
  }
  function hasCoords(p){ return typeof p.lat === "number" && typeof p.lng === "number"; }
  function mealKey(p){ return p.meal || "none"; }

  function fmtDate(d){
    var parts = String(d || "").split("-");
    if(parts.length !== 3) return "";
    var dt = new Date(+parts[0], +parts[1] - 1, +parts[2]);   // local, not UTC
    if(isNaN(dt.getTime())) return "";
    return dt.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY) || localStorage.getItem(LEGACY_KEY);
      if(raw){
        var saved = JSON.parse(raw);
        if(Array.isArray(saved)) return saved;
      }
    }catch(e){}
    return [];
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(places)); }catch(e){} }

  var STAR = '<path d="M12 3.6l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.5-.8z"/>';

  function starSvg(filled){
    return '<svg viewBox="0 0 24 24" fill="' + (filled ? "currentColor" : "none") +
           '" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">' + STAR + '</svg>';
  }

  function isTried(p){ return !!p.tried; }

  /* ---------- known venues, from OpenStreetMap ----------
     One Overpass query per park, scoped to the park's own polygon rather
     than a latitude guess, then cached. Searching runs against the cache,
     never per keystroke: Nominatim's policy forbids autocomplete traffic
     and Overpass is a volunteer-run service. It also means the suggestions
     still work in the park, where there is no signal. */

  var OSM_KEY  = "magicMunchMap.osm.v1";
  var OSM_AMEN = "^(restaurant|fast_food|cafe|ice_cream|bar|pub|biergarten)$";
  var OSM_AREA = [
    { k:"dl",  sel:'["tourism"="theme_park"]["name"="Disneyland"]' },
    { k:"dca", sel:'["tourism"="theme_park"]["name"="Disney California Adventure"]' },
    // Downtown Disney is not a theme park; it is mapped as retail landuse.
    { k:"dtd", sel:'["landuse"="retail"]["name"="Downtown Disney"]' }
  ];
  var KINDS = {
    restaurant:"Table service", fast_food:"Quick service", cafe:"Cafe",
    ice_cream:"Ice cream", bar:"Bar", pub:"Pub", biergarten:"Beer garden"
  };
  function safeUrl(u){
    return /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
  }
  function tidy(str){
    return String(str || "").split(";")[0].replace(/_/g, " ").replace(/^./, function(c){ return c.toUpperCase(); });
  }
  function venueBlurb(v){
    return [KINDS[v.kind] || tidy(v.kind), tidy(v.cuisine), PARKS[v.park]].filter(Boolean).join(" · ");
  }
  var venues = [];
  var venuesFetched = "";
  var fetching = false;

  (function restoreVenues(){
    try{
      var raw = localStorage.getItem(OSM_KEY);
      if(raw){
        var o = JSON.parse(raw);
        if(o && o.venues && o.venues.length){ venues = o.venues; venuesFetched = o.fetched || ""; }
      }
    }catch(e){}
  })();

  function fetchVenues(done){
    if(fetching) return;
    fetching = true;
    var out = [], pending = OSM_AREA.length, failed = false;

    OSM_AREA.forEach(function(pk){
      var q = '[out:json][timeout:60];area' + pk.sel + '->.p;' +
              '(node(area.p)["amenity"~"' + OSM_AMEN + '"]["name"];' +
              ' way(area.p)["amenity"~"' + OSM_AMEN + '"]["name"];);out center tags;';
      fetch("https://overpass-api.de/api/interpreter", {
        method:"POST",
        headers:{ "Content-Type":"application/x-www-form-urlencoded" },
        body:"data=" + encodeURIComponent(q)
      }).then(function(r){ return r.json(); }).then(function(d){
        (d.elements || []).forEach(function(e){
          var t = e.tags || {};
          var la = e.lat !== undefined ? e.lat : (e.center && e.center.lat);
          var ln = e.lon !== undefined ? e.lon : (e.center && e.center.lon);
          if(t.name && typeof la === "number" && typeof ln === "number"){
            var v = { name:t.name, lat:+la.toFixed(5), lng:+ln.toFixed(5), park:pk.k };
            if(t.amenity) v.kind = t.amenity;                       // restaurant vs fast_food etc
            if(t.cuisine) v.cuisine = t.cuisine;
            if(t.website) v.website = t.website;
            if(t["mobile_ordering"] === "yes") v.mobile = true;      // Disney mobile order
            if(t["outdoor_seating"] === "yes") v.outdoor = true;
            out.push(v);
          }
        });
        step();
      }, function(){ failed = true; step(); });
    });

    function step(){
      if(--pending > 0) return;
      fetching = false;
      // OSM often holds both a node and a building way for one venue
      var seen = {}, list = [];
      out.forEach(function(v){
        var key = v.park + "|" + v.name.toLowerCase();
        if(!seen[key]){ seen[key] = true; list.push(v); }
      });
      list.sort(function(a,b){ return a.name.localeCompare(b.name); });
      if(list.length){
        setVenues(list, new Date().toISOString());
        pushVenues();          // share it, so nobody else has to fetch
      }
      done(list.length, failed);
    }
  }

  // Three zones now, so a latitude threshold cannot separate them. Ask the
  // venue data which zone the closest mapped thing belongs to instead.
  function setVenues(list, fetched){
    venues = list;
    venuesFetched = fetched || "";
    try{ localStorage.setItem(OSM_KEY, JSON.stringify({ fetched:venuesFetched, venues:list })); }catch(e){}
    renderOsm();
  }

  // The venue list is identical for everyone, so it lives in one shared
  // document. The first signed-in device to find it missing fetches it from
  // Overpass and writes it; every device after that just reads it.
  function pushVenues(){
    if(!(cloud.on && cloud.user) || !venues.length) return;
    cloud.db.collection("venues").doc("all")
      .set({ fetched: venuesFetched, list: venues })
      .then(null, function(){});
  }

  function watchVenues(){
    if(cloud.venueUnsub){ cloud.venueUnsub(); cloud.venueUnsub = null; }
    cloud.venueUnsub = cloud.db.collection("venues").doc("all").onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      if(d && d.list && d.list.length){
        setVenues(d.list, d.fetched);
      }else if(!fetching && !venues.length){
        fetchVenues(function(){});      // nobody has populated it yet
      }else if(!fetching && venues.length){
        pushVenues();                   // we have a local copy; seed the shared one
      }
    }, function(){});
  }

  function nearestPark(lat, lng){
    var n = nearestVenue(lat, lng, Infinity);
    return n ? n.v.park : "dl";
  }

  function nearestVenue(lat, lng, maxMetres){
    var best = null, bestD = Infinity;
    var scale = Math.cos(lat * Math.PI / 180);
    venues.forEach(function(v){
      var dy = (v.lat - lat) * 111320;
      var dx = (v.lng - lng) * 111320 * scale;
      var d = Math.sqrt(dy*dy + dx*dx);
      if(d < bestD){ bestD = d; best = v; }
    });
    return (best && bestD <= maxMetres) ? { v:best, d:Math.round(bestD) } : null;
  }

  function svg(inner, sw){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+
           '" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
  }

  var map = L.map("map",{scrollWheelZoom:true,zoomControl:true}).setView(CENTER.all, ZOOM.all);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  map.setMaxBounds([[33.798,-117.933],[33.822,-117.905]]);

  function icon(p){
    return L.divIcon({
      className:"",
      html:'<div class="pin'+(p.must?" must":"")+'" style="background:'+FOOD+'"><i></i></div>',
      iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-22]
    });
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function popupHtml(p){
    var bits = [PARKS[p.park], p.land, MEAL_LABEL[p.meal], fmtDate(p.date)].filter(Boolean).join(" · ");
    return '<div class="pop"><b>'+esc(p.name)+'</b><div class="m">'+esc(bits)+'</div>'+
           (p.note?'<div class="n">'+esc(p.note)+'</div>':'')+
           (safeUrl(p.website)?'<a class="n" href="'+esc(safeUrl(p.website))+'" target="_blank" rel="noopener noreferrer">Menu \u2197</a>':'')+
           (p.must?'<div class="g">Must do</div>':'')+'</div>';
  }

  function visible(p){
    if(p.park && !state.parks[p.park]) return false;
    if(!state.meals[mealKey(p)]) return false;
    if(state.mustOnly && !p.must) return false;
    if(state.query){
      var hay = (p.name+" "+(p.land||"")+" "+(p.note||"")).toLowerCase();
      if(hay.indexOf(state.query) === -1) return false;
    }
    return true;
  }

  function drawMarkers(shown){
    Object.keys(markers).forEach(function(id){ map.removeLayer(markers[id]); });
    markers = {};
    shown.filter(hasCoords).forEach(function(p){
      var m = L.marker([p.lat,p.lng],{icon:icon(p),draggable:state.moving,title:p.name});
      m.bindPopup(popupHtml(p));
      m.on("dragend",function(e){
        var ll = e.target.getLatLng();
        p.lat = +ll.lat.toFixed(5);
        p.lng = +ll.lng.toFixed(5);
        persist(p, ["lat","lng"]);
      });
      m.addTo(map);
      markers[p.id] = m;
    });
  }

  function emptyMsg(){
    return places.length
      ? "No places match these filters. Try switching some chips back on."
      : "Nothing here yet. Tap Add to start the list.";
  }

  // Searching covers the shared venue list too, so a place you have not saved
  // yet is still findable - and one tap away from being on the list.
  function venueHits(){
    if(!state.query || state.query.length < 2) return [];
    var have = {};
    places.forEach(function(p){ have[String(p.name || "").toLowerCase()] = true; });
    return venues.filter(function(v){
      if(!state.parks[v.park]) return false;
      if(have[v.name.toLowerCase()]) return false;
      return (v.name + " " + (v.cuisine || "")).toLowerCase().indexOf(state.query) !== -1;
    }).slice(0, 8);
  }

  function addVenue(v){
    var p = {
      id: "new-" + Date.now(), name: v.name, park: v.park, land: "Unsorted",
      meal: "", date: "", lat: v.lat, lng: v.lng, must: false, note: "",
      tried: false, visited: "", rating: 0, verdict: "",
      kind: v.kind || "", cuisine: v.cuisine || "", website: v.website || "",
      mobile: !!v.mobile, outdoor: !!v.outdoor, ord: nextOrd()
    };
    places.push(p);
    persist(p);
    render();
  }

  function drawVenueHits(host){
    var hits = venueHits();
    if(!hits.length) return;
    var sec = document.createElement("section");
    sec.className = "group";
    var h = document.createElement("div");
    h.className = "dayhead";
    h.innerHTML = '<span class="nm">Not on your list</span><span class="ct">' + hits.length + '</span>';
    sec.appendChild(h);
    hits.forEach(function(v){
      var el = document.createElement("div");
      el.className = "card ghost";
      var sw = document.createElement("div");
      sw.className = "swatch";
      sw.style.background = FOOD;
      sw.innerHTML = svg(GLYPH, 2);
      el.appendChild(sw);
      var body = document.createElement("div");
      body.className = "body";
      var nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = v.name;
      body.appendChild(nm);
      var sub = document.createElement("p");
      sub.className = "note";
      sub.textContent = venueBlurb(v);
      body.appendChild(sub);
      el.appendChild(body);
      var acts = document.createElement("div");
      acts.className = "acts one";
      var add = document.createElement("button");
      add.type = "button";
      add.className = "iconbtn";
      add.setAttribute("aria-label", "Add " + v.name + " to the list");
      add.innerHTML = svg('<path d="M12 5v14M5 12h14"/>', 2.2);
      add.addEventListener("click", function(){ addVenue(v); });
      acts.appendChild(add);
      el.appendChild(acts);
      sec.appendChild(el);
    });
    host.appendChild(sec);
  }

  function drawList(shown){
    var host = document.getElementById("list");
    host.innerHTML = "";

    if(!shown.length){
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = emptyMsg();
      host.appendChild(empty);
      drawVenueHits(host);
      return;
    }

    var order = [], groups = {};
    shown.forEach(function(p){
      var key = p.park + "|" + (p.land || "Unsorted");
      if(!groups[key]){ groups[key] = []; order.push(key); }
      groups[key].push(p);
    });

    order.forEach(function(key){
      var parts = key.split("|");
      var g = document.createElement("section");
      g.className = "group";
      var h = document.createElement("div");
      h.className = "grouphead";
      h.innerHTML = '<span class="nm">'+esc(parts[1])+'</span><span class="pk">'+esc(PARKS[parts[0]]||"")+'</span>';
      g.appendChild(h);
      groups[key].forEach(function(p){ g.appendChild(cardFor(p)); });
      host.appendChild(g);
    });
    drawVenueHits(host);
  }

  function drawTimeline(shown){
    var host = document.getElementById("list");
    host.innerHTML = "";
    if(!shown.length){
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = places.length ? emptyMsg() : "Nothing planned yet. Add a place and give it a day.";
      host.appendChild(empty);
      return;
    }

    var byDate = {}, dates = [];
    shown.forEach(function(p){
      var d = p.date || "";
      if(!byDate[d]){ byDate[d] = []; dates.push(d); }
      byDate[d].push(p);
    });
    // ISO dates sort correctly as strings; undated falls to the end.
    dates.sort(function(a,b){
      if(!a) return 1;
      if(!b) return -1;
      return a < b ? -1 : a > b ? 1 : 0;
    });

    dates.forEach(function(d){
      var sec = document.createElement("section");
      sec.className = "group";
      var h = document.createElement("div");
      h.className = "dayhead";
      h.innerHTML = '<span class="nm">' + esc(d ? (fmtDate(d) || d) : "Unscheduled") + '</span>' +
                    '<span class="ct">' + byDate[d].length + '</span>';
      sec.appendChild(h);

      var items = byDate[d].slice().sort(function(a,b){
        var ao = MEAL_ORDER[a.meal] === undefined ? 99 : MEAL_ORDER[a.meal];
        var bo = MEAL_ORDER[b.meal] === undefined ? 99 : MEAL_ORDER[b.meal];
        return ao - bo || (a.ord || 0) - (b.ord || 0);
      });

      var lastMeal = null;
      items.forEach(function(p){
        var mk = p.meal || "";
        if(mk !== lastMeal){
          lastMeal = mk;
          var mh = document.createElement("div");
          mh.className = "mealhead";
          mh.textContent = mk ? MEAL_LABEL[mk] : "No meal set";
          sec.appendChild(mh);
        }
        sec.appendChild(cardFor(p));
      });
      host.appendChild(sec);
    });
  }

  function drawTried(shown){
    var host = document.getElementById("list");
    host.innerHTML = "";
    var done = shown.filter(isTried);
    var todo = shown.filter(function(p){ return !isTried(p); });

    // most recently eaten first, then best rated
    done.sort(function(a,b){
      var av = a.visited || "", bv = b.visited || "";
      if(av !== bv) return av < bv ? 1 : -1;
      return (b.rating || 0) - (a.rating || 0);
    });
    todo.sort(function(a,b){ return (a.ord || 0) - (b.ord || 0); });

    if(!shown.length){
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = emptyMsg();
      host.appendChild(empty);
      return;
    }

    [["Tried", done], ["Still to try", todo]].forEach(function(pair){
      var sec = document.createElement("section");
      sec.className = "group";
      var h = document.createElement("div");
      h.className = "dayhead";
      h.innerHTML = '<span class="nm">' + pair[0] + '</span><span class="ct">' + pair[1].length + '</span>';
      sec.appendChild(h);
      if(!pair[1].length){
        var none = document.createElement("p");
        none.className = "empty";
        none.textContent = pair[0] === "Tried" ? "Nothing yet. Go eat something." : "You have eaten everything on the list.";
        sec.appendChild(none);
      }else{
        pair[1].forEach(function(p){ sec.appendChild(cardFor(p)); });
      }
      host.appendChild(sec);
    });
  }

  function cardFor(p){
    var el = document.createElement("div");
    el.className = "card" + (p.must ? " must" : "");

    var sw = document.createElement("div");
    sw.className = "swatch";
    sw.style.background = FOOD;
    sw.innerHTML = svg(GLYPH, 2);
    el.appendChild(sw);

    var body = document.createElement("div");
    body.className = "body";

    var name = document.createElement("button");
    name.type = "button";
    name.className = "name";
    name.textContent = p.name;
    name.addEventListener("click", function(){ if(hasCoords(p)){ setView("map"); focus(p); } else { armPlacement(p); } });
    body.appendChild(name);

    var tags = [];
    if(p.kind) tags.push(["tag", KINDS[p.kind] || tidy(p.kind)]);
    if(p.cuisine) tags.push(["tag", tidy(p.cuisine)]);
    if(p.mobile) tags.push(["tag", "Mobile order"]);
    if(p.meal) tags.push(["tag meal", MEAL_LABEL[p.meal]]);
    if(p.date && fmtDate(p.date)) tags.push(["tag", fmtDate(p.date)]);
    if(!hasCoords(p)) tags.push(["tag nowhere", "No pin yet"]);
    if(isTried(p)) tags.push(["tag tried", p.visited && fmtDate(p.visited) ? "Tried " + fmtDate(p.visited) : "Tried"]);
    if(p.must) tags.push(["tag gold", "Must do"]);
    if(tags.length){
      var meta = document.createElement("div");
      meta.className = "meta";
      tags.forEach(function(t){
        var el = document.createElement("span");
        el.className = t[0];
        el.textContent = t[1];
        meta.appendChild(el);
      });
      body.appendChild(meta);
    }

    if(p.rating){
      var rate = document.createElement("div");
      rate.className = "rate";
      rate.setAttribute("aria-label", p.rating + " out of 5");
      var h = "";
      for(var i = 1; i <= 5; i++){
        h += '<span class="' + (i <= p.rating ? "" : "off") + '">' + starSvg(i <= p.rating) + '</span>';
      }
      rate.innerHTML = h;
      body.appendChild(rate);
    }

    if(p.note){
      var n = document.createElement("p");
      n.className = "note";
      n.textContent = p.note;
      body.appendChild(n);
    }

    var url = safeUrl(p.website);
    if(url){
      var a = document.createElement("a");
      a.className = "wlink";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      // Disney publishes no deep link into mobile ordering - their universal
      // link manifest claims only /passes/renew/ - so this is the dining page,
      // which is where the menu and the mobile-order button live.
      a.textContent = p.mobile ? "Menu & mobile order \u2197" : "Menu \u2197";
      body.appendChild(a);
    }

    if(p.verdict){
      var v = document.createElement("p");
      v.className = "verdict";
      v.textContent = "\u201c" + p.verdict + "\u201d";
      body.appendChild(v);
    }
    el.appendChild(body);

    var acts = document.createElement("div");
    acts.className = "acts";

    var star = document.createElement("button");
    star.type = "button";
    star.className = "iconbtn";
    star.setAttribute("aria-pressed", p.must ? "true" : "false");
    star.setAttribute("aria-label", (p.must ? "Unmark " : "Mark ") + p.name + " as a must do");
    star.innerHTML = svg('<path d="M12 3.6l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.5-.8z"/>', 1.8);
    star.addEventListener("click", function(){ p.must = !p.must; persist(p, ["must"]); render(); });
    acts.appendChild(star);

    var loc = document.createElement("button");
    loc.type = "button";
    loc.className = "iconbtn";
    if(hasCoords(p)){
      loc.setAttribute("aria-label", "Show " + p.name + " on the map");
      loc.innerHTML = svg('<circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>', 1.9);
      loc.addEventListener("click", function(){ setView("map"); focus(p); });
    }else{
      loc.setAttribute("aria-label", "Place " + p.name + " on the map");
      loc.innerHTML = svg('<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><path d="M12 7v6M9 10h6"/>', 1.9);
      loc.addEventListener("click", function(){ armPlacement(p); });
    }
    acts.appendChild(loc);

    var edit = document.createElement("button");
    edit.type = "button";
    edit.className = "iconbtn";
    edit.setAttribute("aria-label", "Edit " + p.name);
    edit.innerHTML = svg('<path d="M4 20h4L19 9a2.1 2.1 0 00-3-3L5 17z"/>', 1.9);
    edit.addEventListener("click", function(){ openDialog(p); });
    acts.appendChild(edit);

    var del = document.createElement("button");
    del.type = "button";
    del.className = "iconbtn";
    del.setAttribute("aria-label", "Remove " + p.name);
    del.innerHTML = svg('<path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7"/>', 1.9);
    del.addEventListener("click", function(){
      if(!confirm("Remove " + p.name + "?")) return;
      places = places.filter(function(x){ return x.id !== p.id; });
      persistDelete(p.id); render();
    });
    acts.appendChild(del);

    el.appendChild(acts);
    return el;
  }

  function cancelPlacement(){
    placingId = null;
    if(!state.moving) document.getElementById("placebar").hidden = true;
    document.getElementById("map").style.cursor = "";
  }

  function setView(v){
    if(v !== "map") cancelPlacement();   // else a stray tap later moves a forgotten place
    state.view = v;
    document.body.setAttribute("data-view", v);
    document.querySelectorAll(".seg button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.view === v ? "true" : "false");
    });
    // Leaflet measures 0x0 while the container is display:none, so it has to be
    // told to re-measure once the map is actually on screen again.
    if(v === "map") setTimeout(function(){ map.invalidateSize(); }, 0);
    if(fabLabel) fabLabel.textContent = v === "map" ? "Drop pin" : "Add";
    render();
  }

  function focus(p){
    if(!hasCoords(p)) return;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce) map.setView([p.lat,p.lng], 18);
    else map.flyTo([p.lat,p.lng], 18, {duration:.6});
    var m = markers[p.id];
    if(m) setTimeout(function(){ m.openPopup(); }, reduce ? 0 : 620);
    document.getElementById("map").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"});
  }

  function render(){
    var shown = places.filter(visible);
    drawMarkers(shown);
    if(state.view === "time") drawTimeline(shown);
    else if(state.view === "tried") drawTried(shown);
    else drawList(shown);
    var must = shown.filter(function(p){ return p.must; }).length;
    document.getElementById("count").textContent =
      shown.length + (shown.length === 1 ? " place" : " places") + (must ? " · " + must + " must do" : "");
  }

  var dlg = document.getElementById("dlg");
  var err = document.getElementById("dlgErr");
  var triedChk = document.getElementById("fTried");
  var triedBox = document.getElementById("triedBox");
  var rateEl   = document.getElementById("fRating");
  var rating   = 0;

  function paintStars(){
    rateEl.innerHTML = "";
    for(var i = 1; i <= 5; i++){
      (function(v){
        var b = document.createElement("button");
        b.type = "button";
        b.className = v <= rating ? "on" : "";
        b.setAttribute("aria-label", v + (v === 1 ? " star" : " stars"));
        b.setAttribute("aria-pressed", v <= rating ? "true" : "false");
        b.innerHTML = starSvg(v <= rating);
        b.addEventListener("click", function(){
          rating = (rating === v) ? 0 : v;   // tapping the current score clears it
          paintStars();
        });
        rateEl.appendChild(b);
      })(i);
    }
  }

  triedChk.addEventListener("change", function(){
    triedBox.hidden = !triedChk.checked;
  });

  function fillLands(park, current){
    var sel = document.getElementById("fLand");
    var list = LANDS[park] || [];
    sel.innerHTML = "";
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "\u2014 Pick an area \u2014";
    sel.appendChild(blank);
    list.forEach(function(l){
      var o = document.createElement("option");
      o.value = l;
      o.textContent = l;
      sel.appendChild(o);
    });
    // Keep a value the preset list does not know about - older free-text
    // records, or a land that belongs to the other park - rather than
    // silently rewriting it on save.
    if(current && list.indexOf(current) === -1){
      var o2 = document.createElement("option");
      o2.value = current;
      o2.textContent = current;
      sel.appendChild(o2);
    }
    sel.value = current || "";
  }

  var parkSel = document.getElementById("fPark");
  parkSel.addEventListener("change", function(){
    var sel = document.getElementById("fLand");
    var keep = (LANDS[parkSel.value] || []).indexOf(sel.value) === -1 ? "" : sel.value;
    fillLands(parkSel.value, keep);
  });

  function openDialog(p, seed){
    editingId = p ? p.id : null;
    sheetCoords = seed && seed.lat !== undefined ? { lat:seed.lat, lng:seed.lng } : null;
    sheetMeta = seed && seed.meta ? seed.meta : null;
    dlgNote.textContent = seed && seed.note ? seed.note : "";
    hideSuggest();
    // Signed in, watchVenues() has already supplied these from the shared
    // document. Signed out with an empty cache, fetch them once.
    if(!venues.length && !fetching && !(cloud.on && cloud.user)) fetchVenues(function(){});
    document.getElementById("dlgTitle").textContent = p ? "Edit place" : "Add a place";
    fNameEl.value = p ? p.name : (seed && seed.name ? seed.name : "");
    var pk = p ? (p.park || "dl") : (seed && seed.park ? seed.park : "dl");
    parkSel.value = pk;
    fillLands(pk, p ? (p.land || "") : "");
    document.getElementById("fMeal").value = p ? (p.meal||"") : "";
    document.getElementById("fDate").value = p ? (p.date||"") : "";
    document.getElementById("fNote").value = p ? (p.note||"") : "";
    triedChk.checked = p ? isTried(p) : false;
    triedBox.hidden = !triedChk.checked;
    document.getElementById("fVisited").value = p ? (p.visited||"") : "";
    document.getElementById("fVerdict").value = p ? (p.verdict||"") : "";
    rating = p && p.rating ? p.rating : 0;
    paintStars();
    err.style.display = "none";
    dlg.showModal();
    fNameEl.focus();
  }

  var fNameEl = document.getElementById("fName");
  var acbox   = document.getElementById("acbox");
  var dlgNote = document.getElementById("dlgNote");
  var sheetCoords = null;    // set by picking a venue, or by dropping a pin
  var sheetMeta = null;      // venue details copied across when one is picked

  function hideSuggest(){ acbox.hidden = true; acbox.innerHTML = ""; }

  function pickVenue(v){
    fNameEl.value = v.name;
    parkSel.value = v.park;
    fillLands(v.park, document.getElementById("fLand").value);
    sheetCoords = { lat:v.lat, lng:v.lng };   // the surveyed position, not a guess
    sheetMeta = {
      kind: v.kind || "", cuisine: v.cuisine || "",
      website: v.website || "", mobile: !!v.mobile, outdoor: !!v.outdoor
    };
    dlgNote.textContent = venueBlurb(v) + (v.mobile ? " · Mobile order" : "");
    hideSuggest();
    err.style.display = "none";
  }

  function showSuggest(){
    var q = fNameEl.value.trim().toLowerCase();
    acbox.innerHTML = "";
    if(q.length < 2 || !venues.length){ acbox.hidden = true; return; }
    var hits = venues.filter(function(v){
      return v.name.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 7);
    if(!hits.length){ acbox.hidden = true; return; }
    hits.forEach(function(v){
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = esc(v.name) + '<span class="sub">' + esc(venueBlurb(v)) + '</span>';
      b.addEventListener("click", function(){ pickVenue(v); });
      acbox.appendChild(b);
    });
    acbox.hidden = false;
  }

  fNameEl.addEventListener("input", function(){
    err.style.display = "none";
    showSuggest();
  });

  document.getElementById("dlgForm").addEventListener("keydown", function(e){
    if(e.key === "Enter" && e.target.tagName !== "TEXTAREA"){
      e.preventDefault();
      document.getElementById("dlgSave").click();
    }
  });
  document.getElementById("dlgCancel").addEventListener("click", function(){ sheetCoords = null; hideSuggest(); dlg.close(); });

  document.getElementById("dlgSave").addEventListener("click", function(){
    var name = document.getElementById("fName").value.trim();
    if(!name){
      err.textContent = "Give it a name first.";
      err.style.display = "block";
      document.getElementById("fName").focus();
      return;
    }
    var data = {
      name: name,
      park: document.getElementById("fPark").value,
      land: document.getElementById("fLand").value || "Unsorted",
      meal: document.getElementById("fMeal").value,
      date: document.getElementById("fDate").value,
      note: document.getElementById("fNote").value.trim(),
      // Keep the review even when unticked, so unticking by accident is not
      // destructive and re-ticking brings it all back.
      tried: triedChk.checked,
      visited: document.getElementById("fVisited").value,
      rating: rating,
      verdict: document.getElementById("fVerdict").value.trim()
    };
    var target = null, editedExisting = !!editingId;
    if(editingId){
      places.forEach(function(p){ if(p.id === editingId){ Object.assign(p, data); target = p; } });
    }else{
      target = Object.assign({ id: "new-" + Date.now(), must:false, ord: nextOrd() }, data);
      places.push(target);
    }
    var fields = Object.keys(data);
    if(target && sheetCoords){
      target.lat = sheetCoords.lat;
      target.lng = sheetCoords.lng;
      fields = fields.concat(["lat","lng"]);
    }
    if(target && sheetMeta){
      target.kind = sheetMeta.kind;
      target.cuisine = sheetMeta.cuisine;
      target.website = sheetMeta.website;
      target.mobile = sheetMeta.mobile;
      target.outdoor = sheetMeta.outdoor;
      fields = fields.concat(["kind","cuisine","website","mobile","outdoor"]);
    }
    editingId = null; sheetCoords = null; sheetMeta = null;
    hideSuggest();
    if(target) persist(target, editedExisting ? fields : null); else save();
    render(); dlg.close();
  });

  document.getElementById("placeCancel").addEventListener("click", function(){
    if(state.moving) moveBtn.click(); else cancelPlacement();
  });

  document.querySelectorAll(".seg button").forEach(function(b){
    b.addEventListener("click", function(){ setView(b.dataset.view); });
  });

  document.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      var on = c.getAttribute("aria-pressed") === "true";
      c.setAttribute("aria-pressed", on ? "false" : "true");
      if(c.hasAttribute("data-must")) state.mustOnly = !on;
      else if(c.dataset.park) state.parks[c.dataset.park] = !on;
      else if(c.dataset.meal) state.meals[c.dataset.meal] = !on;
      if(c.dataset.park) recenter();   // meal/must filters must not yank the map
      render();
    });

  document.getElementById("search").addEventListener("input", function(e){
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  var addBtn = document.getElementById("addBtn");
  var moveBtn = document.getElementById("moveBtn");
  var hint = document.getElementById("hint");


  // Adding no longer requires a map tap: a place can live in the list with no
  // pin at all and get one later from the target button on its card.
  var NEW_PIN = "\u0000new";
  var fabLabel = document.getElementById("fabLabel");

  addBtn.addEventListener("click", function(){
    // On the map the useful gesture is "something is here"; elsewhere it is
    // "add this place", which needs no coordinates at all.
    if(state.view === "map") armNewPin(); else openDialog(null);
  });

  function armNewPin(){
    setView("map");
    placingId = NEW_PIN;
    document.getElementById("placeMsg").textContent = "Tap the map where the place is.";
    document.getElementById("placebar").hidden = false;
    document.getElementById("map").style.cursor = "crosshair";
  }

  function armPlacement(p){
    setView("map");                 // clears any previous arming, so set the id after
    placingId = p.id;
    document.getElementById("placeMsg").textContent = "Tap the map to place " + p.name + ".";
    document.getElementById("placebar").hidden = false;
    document.getElementById("map").style.cursor = "crosshair";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("map").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"});
  }

  function recenter(){
    var on = Object.keys(state.parks).filter(function(k){ return state.parks[k]; });
    var key = on.length === 1 ? on[0] : "all";
    map.setView(CENTER[key], ZOOM[key]);
  }

  moveBtn.addEventListener("click", function(){
    state.moving = !state.moving;
    if(state.moving) setView("map");
    moveBtn.setAttribute("aria-pressed", state.moving ? "true" : "false");
    moveBtn.textContent = state.moving ? "Done moving pins" : "Move pins";
    if(state.moving){
      setView("map");
      document.getElementById("placeMsg").textContent = "Drag any pin to its real spot. Positions save as you go.";
      document.getElementById("placebar").hidden = false;
    }else if(!placingId){
      document.getElementById("placebar").hidden = true;
    }
    closeMenu();
    render();
  });

  map.on("click", function(e){
    if(!placingId) return;
    var isNew = placingId === NEW_PIN;
    var p = isNew ? null : byId(placingId);
    var lat = +e.latlng.lat.toFixed(5);
    var lng = +e.latlng.lng.toFixed(5);
    cancelPlacement();

    if(isNew){
      // Offer the nearest known venue, but never force it: the pin stands on
      // its own if this is a cart or a stand nobody has mapped.
      var near = nearestVenue(lat, lng, 60);
      openDialog(null, {
        lat: lat, lng: lng,
        name: near ? near.v.name : "",
        park: near ? near.v.park : nearestPark(lat, lng),
        meta: near ? { kind:near.v.kind || "", cuisine:near.v.cuisine || "",
                       website:near.v.website || "", mobile:!!near.v.mobile,
                       outdoor:!!near.v.outdoor } : null,
        note: near
          ? "Nearest mapped venue is " + near.v.name + ", " + near.d + "m away. Clear the name and type your own if that is not it."
          : "No mapped venue within 60m, so the pin stays exactly where you tapped. Give it any name you like."
      });
      return;
    }

    if(!p) return;
    p.lat = lat;
    p.lng = lng;
    persist(p, ["lat","lng"]);
    render();
    focus(p);
  });

  document.getElementById("copyBtn").addEventListener("click", function(){
    var text = JSON.stringify(places.map(function(p){ return toDoc(p); }), null, 2);
    var btn = this;
    function done(ok){
      btn.textContent = ok ? "Copied" : "Copy failed";
      setTimeout(function(){ btn.textContent = "Copy backup"; }, 1800);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(text, done); });
    }else{ fallback(text, done); }
  });

  function fallback(text, done){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    done(ok);
  }

  var resetBtn = document.getElementById("resetBtn");
  var resetArmed = false, resetTimer = null;

  function disarmReset(){
    resetArmed = false;
    if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
    resetBtn.className = "mi danger";
    resetBtn.textContent = "Erase this browser’s data";
  }

  resetBtn.addEventListener("click", function(){
    var signedIn = !!(cloud.on && cloud.user);

    // Two deliberate taps with the count spelled out. A single confirm() is
    // far too easy to dismiss for something that has no undo.
    if(!resetArmed){
      resetArmed = true;
      resetBtn.className = "mi danger armed";
      resetBtn.textContent = signedIn
        ? "Tap again — clears the offline copy only"
        : "Tap again — erases " + places.length + " place" + (places.length === 1 ? "" : "s") + " for good";
      hint.textContent = signedIn
        ? "You are signed in, so the shared list is safe. This only drops what this browser has cached."
        : "You are NOT signed in, so this browser is the only copy. There is no undo. Use Copy backup first if you want one.";
      resetTimer = setTimeout(disarmReset, 6000);
      return;
    }

    disarmReset();
    try{ localStorage.removeItem(KEY); localStorage.removeItem(LEGACY_KEY); }catch(e){}
    if(signedIn){
      hint.textContent = "Offline copy cleared. The shared list is unchanged.";
      return;
    }
    places = load();
    render();
    hint.textContent = "Erased.";
  });

  /* ---------- cloud sync (optional) ----------
     Unconfigured or signed out, none of this runs and the app reads
     localStorage only. Signed in, Firestore
     becomes the store: onSnapshot owns `places` and every mutation
     writes one document, so two phones editing different pins merge
     instead of clobbering each other. */

  var cloud = { on:false, db:null, user:null, unsub:null, venueUnsub:null, empty:false, cache:false, err:"" };
  var FIELDS = ["name","park","land","meal","date","lat","lng","must","note","tried","visited","rating","verdict","kind","cuisine","website","mobile","outdoor","ord"];

  var syncDot   = document.getElementById("syncDot");
  var syncWho   = document.getElementById("syncWho");
  var syncMsgEl = document.getElementById("syncMsg");
  var authBtn   = document.getElementById("authBtn");
  var uploadBtn = document.getElementById("uploadBtn");
  var acctBtn   = document.getElementById("acctBtn");

  function configured(){
    return !!(window.FIREBASE_CONFIG && typeof firebase !== "undefined");
  }

  function nextOrd(){
    var max = -1;
    places.forEach(function(p){ if(typeof p.ord === "number" && p.ord > max) max = p.ord; });
    return max + 1;
  }

  function toDoc(p, only){
    var keys = only || FIELDS;
    var d = {};
    keys.forEach(function(k){ if(p[k] !== undefined && p[k] !== null) d[k] = p[k]; });
    if(!only){
      if(d.must === undefined) d.must = false;
      if(d.note === undefined) d.note = "";
    }
    return d;
  }

  function renderSync(){
    if(!configured()){
      syncDot.className = "dotstat";
      authBtn.hidden = true;
      uploadBtn.hidden = true;
      acctBtn.className = "acct";
      acctBtn.textContent = "Menu";
      if(!window.FIREBASE_CONFIG){
        syncWho.textContent = "Not set up — saving to this browser only.";
        syncMsgEl.textContent = cloud.err ||
          "firebase-config.js has no config. If you just deployed one, reload the " +
          "page — GitHub Pages caches files for ten minutes.";
      }else{
        syncWho.textContent = "Firebase didn't load.";
        syncMsgEl.textContent = cloud.err ||
          "The config is here but the Firebase scripts never arrived. An ad blocker " +
          "or content blocker is the usual cause; a privacy extension blocking " +
          "gstatic.com will do it. Saving to this browser meanwhile.";
      }
      return;
    }
    authBtn.hidden = false;
    if(cloud.user){
      syncDot.className = "dotstat " + (!cloud.on ? "" : cloud.cache ? "warn" : "ok");
      syncWho.textContent = cloud.user.email || "Signed in";
      authBtn.textContent = "Sign out";
      acctBtn.className = "acct in";
      acctBtn.textContent = (cloud.user.email || "?").charAt(0).toUpperCase();
      acctBtn.setAttribute("aria-label", "Menu — signed in as " + (cloud.user.email || ""));
      var localCount = load().length;
      uploadBtn.hidden = localCount === 0;
      uploadBtn.textContent = "Upload " + localCount + " from this browser";
      syncMsgEl.textContent = cloud.err ||
        (cloud.cache ? "Offline. Edits are saved here and sync when you get signal."
                     : "Shared list. Edits show up on every signed-in device.");
    }else{
      syncDot.className = "dotstat";
      syncWho.textContent = "Signed out — saving to this browser only.";
      authBtn.textContent = "Sign in with Google";
      acctBtn.className = "acct";
      acctBtn.textContent = "Sign in";
      acctBtn.setAttribute("aria-label", "Menu — signed out");
      uploadBtn.hidden = true;
      syncMsgEl.textContent = cloud.err || "";
    }
  }

  function startWatch(){
    stopWatch();
    cloud.on = true;
    cloud.unsub = cloud.db.collection("places").onSnapshot(
      { includeMetadataChanges:true },
      function(snap){
        var next = [];
        snap.forEach(function(doc){
          var d = doc.data() || {};
          d.id = doc.id;
          next.push(d);
        });
        // Sorted here rather than with orderBy: a multi-field orderBy would
        // need a composite index, and `ord` keeps the curated grouping.
        next.sort(function(a,b){
          var ao = typeof a.ord === "number" ? a.ord : 1e9;
          var bo = typeof b.ord === "number" ? b.ord : 1e9;
          return ao - bo || String(a.name||"").localeCompare(String(b.name||""));
        });
        places = next;
        cloud.empty = next.length === 0;
        cloud.cache = snap.metadata.fromCache;
        cloud.err = "";
        renderSync();
        render();
      },
      function(e){
        if(e.code === "permission-denied"){
          // Rules rejected this account. Drop back to local mode so edits land
          // in localStorage instead of being written nowhere at all.
          cloud.on = false;
          cloud.err = "Not on the guest list. Your email isn't in the Firestore " +
                      "rules, so this is saving to your browser only.";
        }else{
          cloud.err = "Sync error: " + e.message;
        }
        renderSync();
      }
    );
  }

  function stopWatch(){
    if(cloud.unsub){ cloud.unsub(); cloud.unsub = null; }
    if(cloud.venueUnsub){ cloud.venueUnsub(); cloud.venueUnsub = null; }
    cloud.on = false;
  }

  // `only` narrows the write to the fields this action actually touched. Two
  // people editing the same place at once then collide only if they changed the
  // same field: starring something no longer clobbers someone else's note.
  function persist(p, only){
    if(cloud.on && cloud.user){
      cloud.db.collection("places").doc(String(p.id))
        .set(toDoc(p, only), { merge:true })
        .then(null, function(e){
          cloud.err = "Save failed: " + e.message; renderSync();
        });
    }else{
      save();
    }
  }

  function persistDelete(id){
    if(cloud.on && cloud.user){
      cloud.db.collection("places").doc(String(id))["delete"]().then(null, function(e){
        cloud.err = "Delete failed: " + e.message; renderSync();
      });
    }else{
      save();
    }
  }

  if(authBtn) authBtn.addEventListener("click", function(){
    if(cloud.user){ firebase.auth().signOut(); return; }
    cloud.err = ""; renderSync();
    var provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).then(null, function(e){
      var code = e && e.code;
      if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
      if(code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment"){
        firebase.auth().signInWithRedirect(provider);
        return;
      }
      cloud.err = "Sign-in failed: " + (e && e.message ? e.message : code);
      renderSync();
    });
  });

  var osmBtn = document.getElementById("osmBtn");

  function renderOsm(){
    if(!osmBtn) return;
    osmBtn.disabled = fetching;
    osmBtn.textContent = fetching ? "Resyncing\u2026"
      : venues.length ? "Resync map data (" + venues.length + ")"
      : "Load map data";
  }

  if(osmBtn) osmBtn.addEventListener("click", function(){
    renderOsm();
    fetchVenues(function(n, failed){
      renderOsm();
      hint.textContent = n
        ? n + " venues loaded from OpenStreetMap" + (failed ? " (one area failed; try again)" : "") +
          (cloud.on && cloud.user ? " and shared with everyone signed in." : ".")
        : "Could not reach OpenStreetMap. The list still works, you just have to type names yourself.";
    });
    fetching = true;
    renderOsm();
  });

  var menu = document.getElementById("menu");

  function closeMenu(){
    menu.hidden = true;
    acctBtn.setAttribute("aria-expanded", "false");
    disarmReset();
  }
  function openMenu(){
    menu.hidden = false;
    acctBtn.setAttribute("aria-expanded", "true");
  }

  acctBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(menu.hidden) openMenu(); else closeMenu();
  });
  menu.addEventListener("click", function(e){ e.stopPropagation(); });
  document.addEventListener("click", function(){ if(!menu.hidden) closeMenu(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !menu.hidden) closeMenu();
  });

  if(uploadBtn) uploadBtn.addEventListener("click", function(){
    var local = load();
    if(!local.length){ cloud.err = "Nothing here to upload."; renderSync(); return; }
    if(local.length > 450){ cloud.err = "Too many places for one batch (" + local.length + ")."; renderSync(); return; }
    if(!confirm("Add " + local.length + " place(s) from this browser to the shared list?")) return;
    var batch = cloud.db.batch();
    local.forEach(function(p, i){
      var d = toDoc(p);
      if(typeof d.ord !== "number") d.ord = i;
      batch.set(cloud.db.collection("places").doc(String(p.id || ("seed-" + i))), d);
    });
    uploadBtn.disabled = true;
    batch.commit().then(function(){
      uploadBtn.disabled = false;
      cloud.err = "Uploaded " + local.length + " places.";
      renderSync();
    }, function(e){
      uploadBtn.disabled = false;
      cloud.err = "Upload failed: " + e.message;
      renderSync();
    });
  });

  function initCloud(){
    if(!configured()){ renderSync(); return; }
    try{
      firebase.initializeApp(window.FIREBASE_CONFIG);
      cloud.db = firebase.firestore();
      // Offline cache: the park is a dead zone and this app is useless there
      // without it. Fails harmlessly in private windows or a second tab.
      if(cloud.db.enablePersistence){
        cloud.db.enablePersistence({ synchronizeTabs:true }).then(null, function(){});
      }
    }catch(e){
      cloud.err = "Firebase failed to start: " + e.message;
      renderSync();
      return;
    }
    firebase.auth().onAuthStateChanged(function(u){
      cloud.user = u || null;
      cloud.err = "";
      if(u){
        startWatch();
        watchVenues();
      }else{
        stopWatch();
        places = load();
        render();
      }
      renderSync();
    });
    firebase.auth().getRedirectResult().then(null, function(e){
      cloud.err = "Sign-in failed: " + e.message;
      renderSync();
    });
  }

  setView("list");
  renderOsm();
  initCloud();
})();
</script>
</body>
</html>
